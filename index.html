<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JIHYUN CHUN - Portfolio</title>
<meta name="description" content="천지현 — 업무 자동화(RPA) 포트폴리오와 타투 세금 계산 서비스 잉크장부.">
<link rel="stylesheet" href="assets/inter-tight.css">
<style>

  :root {
    --bg: #F0F2F5;
    --surface: #E7EAEE;
    --ink: #181A1D;
    --ink-soft: #3A3E44;
    --muted: #5E636B;
    --faint: #8A9099;
    --line: #D7DBE0;
    --line-soft: #E3E6EA;
    --maxw: 1080px;
    --display: "Inter Tight", system-ui, "Segoe UI", sans-serif;
    --sans: "Noto Sans KR", "Noto Sans", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --surface: #1A1D21; --ink: #E8EBEF; --ink-soft: #C9CDD3;
      --muted: #969CA4; --faint: #6A7079; --line: #282C32; --line-soft: #222529;
    }
  }
  :root[data-theme="light"] {
    --bg: #F0F2F5; --surface: #E7EAEE; --ink: #181A1D; --ink-soft: #3A3E44;
    --muted: #5E636B; --faint: #8A9099; --line: #D7DBE0; --line-soft: #E3E6EA;
  }
  :root[data-theme="dark"] {
    --bg: #121417; --surface: #1A1D21; --ink: #E8EBEF; --ink-soft: #C9CDD3;
    --muted: #969CA4; --faint: #6A7079; --line: #282C32; --line-soft: #222529;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); line-height: 1.62; -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    word-break: keep-all; overflow-wrap: break-word;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  .split { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }

  .pick {
    display: flex; flex-direction: column; justify-content: center;
    padding: 80px 56px; text-decoration: none; color: inherit;
    transition: background-color 0.25s;
  }
  .pick + .pick { border-left: 1px solid var(--line); }
  .pick:hover { background: var(--surface); }
  .pick:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }

  .pick .t {
    font-family: var(--display); font-weight: 500;
    font-size: clamp(1.9rem, 3.4vw, 2.9rem); line-height: 1.1; letter-spacing: -0.015em;
    margin: 0; color: var(--ink);
  }
  .pick .ko { font-size: 1.05rem; color: var(--muted); margin: 12px 0 0; font-weight: 500; }
  .pick .cta {
    margin-top: 34px; align-self: flex-start;
    font-size: 0.78rem; letter-spacing: 0.04em; color: var(--ink);
    border: 1px solid var(--line); border-radius: 2px; padding: 8px 15px; white-space: nowrap;
    transition: border-color 0.2s;
  }
  .pick:hover .cta { border-color: var(--ink); }

  @media (max-width: 760px) {
    .split { grid-template-columns: 1fr; }
    .pick { padding: 72px 28px; }
    .pick + .pick { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>

<h1 class="sr-only">천지현 포트폴리오</h1>

<main class="split">

  <a class="pick" href="rpa.html">
    <h2 class="t">Automation &amp; RPA</h2>
    <p class="ko">업무 자동화 포트폴리오</p>
    <span class="cta">포트폴리오 보기 ↗</span>
  </a>

  <!-- TODO: 잉크장부 사이트를 tattoo-tax/ 에 추가하면 아래 링크가 바로 연결됩니다.
       다른 주소에 배포했다면 href 를 그 주소로 바꾸고 target="_blank" rel="noopener" 를 붙이세요. -->
  <a class="pick" href="tattoo-tax/">
    <h2 class="t">Tattoo Tax Calculator</h2>
    <p class="ko">잉크장부</p>
    <span class="cta">사이트 바로가기 ↗</span>
  </a>

</main>

</body>
</html>
